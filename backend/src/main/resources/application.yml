server:
  port: 6001

spring:
  application:
    name: ai-train-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认连本地 MySQL；Docker 启动时通过 MYSQL_URL 环境变量覆盖成 mysql:3306
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_train_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:zyn1542880368}
  sql:
    init:
      # 开发期 always（每次启动 DROP 重建表 + 灌种子）；生产环境用 Docker 时注入 never
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:sql/init.sql
      continue-on-error: true
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 文件上传本地存储目录（相对路径基于运行目录，也可配置为绝对路径）
file:
  upload-dir: ${UPLOAD_DIR:./upload}

# Resend 邮件（发验证码用）：key 从环境变量注入，不写死进代码（防止进 git 泄露）
resend:
  api-key: ${RESEND_API_KEY}

jwt:
  # 生产环境务必更换为更复杂的密钥（Docker 启动时用环境变量覆盖）
  secret: ${JWT_SECRET:ai-train-platform-secret-key-please-change-in-production-2026}
  expire-hours: 24
